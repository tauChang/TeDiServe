name: Build smoke artifact image

on:
  push:
    branches: [main, artifact-evaluation]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out artifact
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/tediserve-smoke" >> "$GITHUB_OUTPUT"

      - name: Build and publish smoke image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.smoke
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:2027
            ${{ steps.image.outputs.name }}:${{ github.sha }}

  verify-amd64:
    needs: build-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run published AMD64 smoke image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/tediserve-smoke:${GITHUB_SHA}"
          mkdir -p artifact-results
          docker pull --platform linux/amd64 "$image"
          docker run --rm --platform linux/amd64 \
            --user "$(id -u):$(id -g)" \
            -v "$PWD/artifact-results:/opt/tediserve/artifact-results" \
            "$image"
          jq -e '
            .mode == "smoke" and
            .requests_completed == 8 and
            .used_instances == 2 and
            .passed == true
          ' artifact-results/smoke/demo_result.json
