name: Build smoke artifact image

on:
  push:
    branches: [main, artifact-evaluation]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out artifact
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/tediserve-smoke" >> "$GITHUB_OUTPUT"

      - name: Build and publish smoke image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.smoke
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:2027
            ${{ steps.image.outputs.name }}:${{ github.sha }}
